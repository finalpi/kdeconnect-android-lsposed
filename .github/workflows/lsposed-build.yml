name: LSPosed APK
on:
  workflow_dispatch:
  push:
    branches: [codex/lsposed-clipboard]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test clipboard integration
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest --tests 'org.kde.kdeconnect.plugins.clipboard.*' --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: kdeconnect-lsposed-debug
          path: build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clipboard-test-results
          path: build/reports/tests/testDebugUnitTest/
